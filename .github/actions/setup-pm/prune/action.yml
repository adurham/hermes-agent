name: Prune the PM uv cache at job teardown
description: Register uv pruning before the enclosing cache action saves.
inputs:
  uv:
    description: Absolute path to the PM-provisioned uv executable.
    required: true
  cache:
    description: Cache directory restored by the enclosing setup action.
    required: true
runs:
  using: node24
  main: index.mjs
  post: index.mjs
  post-if: success()
