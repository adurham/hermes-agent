name: PM toolchain native smoke
on:
  workflow_call:
    inputs:
      warm:
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  native:
    name: ${{ inputs.warm && 'warm' || 'cold' }} ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          - target: win32-x64
            runner: windows-2025
          - target: win32-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # cryptography has no win_arm64 wheel. Its native build uses the
      # same OpenSSL prerequisite as the bundled release, not an x64 Python.
      - name: Cache native OpenSSL
        if: matrix.target == 'win32-arm64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg\installed\arm64-windows-static-md
          key: vcpkg-openssl-arm64-windows-static-md-${{ runner.os }}
      - name: Install native OpenSSL
        if: matrix.target == 'win32-arm64'
        shell: bash
        run: |
          if [ ! -f /c/vcpkg/installed/arm64-windows-static-md/lib/libcrypto.lib ]; then
            "$VCPKG_INSTALLATION_ROOT/vcpkg" install openssl:arm64-windows-static-md
          fi
          printf 'OPENSSL_DIR=C:\\vcpkg\\installed\\arm64-windows-static-md\nOPENSSL_STATIC=1\n' >> "$GITHUB_ENV"

      - name: Set up tools and dev extra from PM
        id: pm
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '["dev"]'
          # Each workflow run proves a genuinely cold save followed by a
          # different runner restoring it. No pre-existing cache can mask it.
          cache-suffix: smoke-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify next-step PATH and exact cache hits
        shell: bash
        env:
          EXPECT_WARM: ${{ inputs.warm }}
          TOOLS_HIT: ${{ steps.pm.outputs.tools-cache-hit }}
          PYTHON_HIT: ${{ steps.pm.outputs.python-cache-hit }}
          NODE_HIT: ${{ steps.pm.outputs.node-cache-hit }}
        run: |
          python scripts/ci/verify_toolchain.py --extras
          python -c 'import os; expected=os.environ["EXPECT_WARM"]=="true"; values={k:os.environ[k]=="true" for k in ("TOOLS_HIT","PYTHON_HIT","NODE_HIT")}; print(values); assert all(v==expected for v in values.values()), values'

      - name: Install the real locked npm workspace
        shell: bash
        env:
          EXPECT_WARM: ${{ inputs.warm }}
        run: |
          flags=()
          if [ "$EXPECT_WARM" = true ]; then flags+=(--offline); fi
          npm ci --workspace tests-js --include-workspace-root --include=dev --ignore-scripts --no-audit --no-fund ${flags[@]+"${flags[@]}"}
          node node_modules/vitest/vitest.mjs run --root tests-js setup-pm-post.test.mjs generate-icons.test.mjs

      - name: Run the PM and action contracts
        shell: bash
        run: |
          scripts/run_tests.sh -j 2 tests/scripts/test_setup_toolchain.py tests/pm/test_pm_core.py tests/pm/test_bootstrap_import_closure.py tests/pm/test_uv_cache.py
          python scripts/ci/verify_toolchain.py --extras

      - name: Upload native setup proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pm-toolchain-${{ matrix.target }}-${{ inputs.warm && 'warm' || 'cold' }}
          path: ${{ runner.temp }}/pm-toolchain-proof.json
          if-no-files-found: warn
          retention-days: 7
