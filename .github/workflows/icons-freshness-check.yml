name: Icon Assets Freshness

# Guard for the icon pipeline. The sources of truth are the nous-girl SVGs
# (assets/nous-girl-*.svg) and the per-platform backgrounds
# (assets/backgrounds/*.svg). Generated outputs are NOT committed — every
# consuming pipeline regenerates them via scripts/generate-icons.mjs — so
# this lane runs --check, which regenerates every target in memory and
# asserts structural invariants (sizes, transparent squircle corners,
# container frame sets). A source change can never land broken. See
# scripts/generate_icons.py.
#
# Byte-determinism note: resvg renders the same SVG to identical bytes on any
# host for pure-shape artwork. If the master ever contains <text>, font
# rendering can differ across OSes — pin fonts via resvg's font_files/font_dirs
# and commit a known font before relying on this check for that master.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Generated icons match master
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          # Pinned: unpinned setup-uv fetches a 'latest' manifest from
          # raw.githubusercontent.com every job; transient fetch failures
          # fail the job (2026-07-28 incident). Keep in sync with tests.yml.
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      # Pillow is a core dependency; resvg-py rides the dev extra.
      - name: Install locked deps
        run: uv sync --locked --python 3.11 --extra dev

      - name: Verify generated icons are in sync with the master
        run: uv run python scripts/generate_icons.py --check
