name: Termux verification

on:
  push:
    branches: [ethie/cli-bundles]
    paths:
      - 'scripts/termux/**'
      - 'pm/**'
      - 'tests/test_termux*'
      - '.github/workflows/termux-verify.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: termux-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Termux packaging contracts on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.3'
          enable-cache: false
      - name: Install the locked test environment
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          uv venv --python 3.11 .venv
          uv export --frozen --extra dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/requirements.txt"
          uv pip install --python .venv/bin/python -r "$RUNNER_TEMP/requirements.txt"
      - name: Run the native linker and wheel contracts
        run: |
          bash scripts/run_tests.sh -j 2 \
            tests/test_termux_python_linkage.py tests/test_termux_retag_wheel.py \
            tests/test_termux_wheelhouse_cache.py tests/test_termux_runtime_libs.py \
            tests/test_termux_launchers.py tests/test_pm_bionic.py \
            tests/pm/test_stage_only.py tests/pm/test_deb_safety.py tests/test_stage_apt_repo.py

  native-linkage:
    name: Reproduce and verify bionic Python linkage
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.3'
          enable-cache: false
      - name: Stage the pinned bionic runtimes
        run: |
          bash scripts/termux/build_cpython.sh termux-build/payload
          bash scripts/termux/build_uv.sh termux-build/payload
          python3 scripts/termux/stage_runtime_libs.py termux-build/payload
      - name: Download the wheel from the confirmed failing build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: 34044387547
          name: termux-linkage-842e3b0eed0eafbfb3d7f219ea465bd92d055cc2
          path: termux-build/baseline
      - name: Run the native reproduction
        run: |
          image=ghcr.io/ethernet8023/hermes-termux-builder:c14ffb703abf
          docker pull "$image"
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          printf 'Builder image: %s\n' "$image"
          mkdir -p termux-build/linkage
          chmod 0777 termux-build/linkage
          docker run --rm --platform linux/arm64 --user 1000:1000 \
            -v "$PWD:/repo:ro" -v "$PWD/termux-build/payload:/payload:ro" \
            -v "$PWD/termux-build/linkage:/evidence" \
            "$image" bash -c '
              set -euo pipefail
              export PREFIX=/data/data/com.termux/files/usr
              export LD_LIBRARY_PATH="/payload/python$PREFIX/lib:/payload/runtime-libs/lib:$PREFIX/lib"
              exec "/payload/python$PREFIX/bin/python3.11" \
                /repo/scripts/termux/probe_python_linkage.py \
                --repo /repo --payload /payload --output /evidence \
                --built-wheel /repo/termux-build/baseline/firecrawl_anydoc-0.2.4-cp310-abi3-android_24_arm64_v8a.whl
            '
      - name: Preserve the built wheel and linker evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: termux-linkage-${{ github.sha }}
          path: termux-build/linkage/
          if-no-files-found: warn
          retention-days: 7
