name: hermes-vision-inline
repo: https://github.com/BrokeSkill/hermes-vision-inline
sha: 281bce608e799834cd1b60929d3f9b44756cb7c2
description: >-
  Attach an image inline to the session model when it can see one, instead of
  letting an explicit auxiliary.vision backend describe it. Core already attaches
  images natively by default; what this plugin changes is an explicit
  auxiliary.vision setting, which it overrides so the model reads the pixels
  directly. The image stays in context, so follow-ups do not reprocess it. The
  model's modality comes from the local models.dev cache; no network calls and
  nothing to configure.
maintainer: BrokeSkill
