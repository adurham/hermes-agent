name: reaction-feedback
repo: https://github.com/AhmetArif0/hermes-reaction-feedback
sha: a0fcc778bbd4778ca5c59f57af5d93378d23d402
subdir: reaction-feedback
description: >-
  Lets the agent see the emoji reactions you leave on its Telegram messages: react 👍 or 👎 to
  a reply and the agent's next turn in that private chat starts with a short note naming the
  reaction and the message it followed. Disclosure — registers pre_gateway_dispatch (always
  returns None, so dispatch is never changed), pre_llm_call and gateway_platform_event hooks;
  keeps a bounded in-memory record of private-chat message ids, 60-character excerpts and
  reactions; writes nothing to disk, makes no network requests, starts no processes and
  reads no secrets.
maintainer: AhmetArif0
tier: community
category: general
requires_hermes: ">=0.21.5"
docs_url: https://github.com/AhmetArif0/hermes-reaction-feedback
version: "1.0.0"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
  - pre_gateway_dispatch
  - pre_llm_call
  - gateway_platform_event
  provides_middleware: []
  requires_env: []
