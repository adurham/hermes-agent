title: Enchanted Composer
description: >-
  Draft enhancement, reusable prompt libraries, undo/redo, and owner-bound full-duplex voice
  for Hermes Desktop. Disclosure — explicit voice use captures microphone audio; subscription
  voice starts the official Codex app-server child process, API billing sends SDP to the
  configured HTTPS offer endpoint, and a custom bridge uses the configured WSS endpoint. The
  plugin stores non-secret settings and bounded local activity, reads a bounded SOUL.md for the
  captured profile, and has no telemetry, self-updater, or Codex OAuth-file access. Its product
  design and implementation are original; no external plugin source, UI, CSS, images, or
  generated runtime files are included.
maintainer: Deadtrix21
tier: community
category: voice
requires_hermes: ">=0.21.5"
