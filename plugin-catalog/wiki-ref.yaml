description: >-
  @wiki:<title> context references: attach the lead section of a Wikipedia article to a message,
  with title autocomplete in the TUI and Desktop composer. Disclosure — sends HTTPS GET requests to
  <language>.wikipedia.org/w/api.php only (the referenced title and the typed autocomplete prefix
  leave the machine); no API key, no files written, no subprocess; register() only adds the @wiki:
  reference provider.
